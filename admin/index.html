<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Панель управления</title>
  <style>
    body { background: #0b0a08; color: #e8e3d9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 90vh; margin: 0; padding: 20px; text-align: center; }
    .box { background: #14110d; border: 1px solid rgba(212,175,55,0.4); padding: 30px; max-width: 400px; border-radius: 4px; }
    h1 { font-size: 1.5rem; color: #e6c875; margin-bottom: 15px; }
    p { color: #a89f91; font-size: 0.9rem; margin-bottom: 20px; }
    a.btn { display: inline-block; background: linear-gradient(135deg, #e6c875, #c59b27); color: #000; font-weight: bold; padding: 12px 20px; text-decoration: none; border-radius: 2px; font-size: 0.85rem; text-transform: uppercase; }
    a.back { display: block; margin-top: 20px; color: #7a7165; text-decoration: none; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Панель управления</h1>
    <p>Добавление и редактирование работ производится через сервис Pages CMS.</p>
    <a class="btn" href="https://app.pagescms.org/" target="_blank">Открыть Pages CMS</a>
    <a class="back" href="../">← Вернуться на сайт</a>
  </div>
</body>
</html>
